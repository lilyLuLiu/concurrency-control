<!DOCTYPE html>
<html>

<head>
    <title>Concurrency Control for {{ project_name }}</title>
    <meta http-equiv="refresh" content="30">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h1>Concurrency Control for {{ project_name }}</h1>
        <div class="table-container">
            <h2>Machine Status</h2>
            <table border="1">
                <tr>
                    <th>Machine</th>
                    <th>Status</th>
                </tr>
                {% for machine, status in statuses.items() %}
                <tr>
                    <td>{{ machine }}</td>
                    <td>{{ status }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>

        <div class="table-container">
            <h2>Running Pipelines</h2>
            <table border="1">
                <tr>
                    <th>Pipeline Run</th>
                    <th>Machine</th>
                </tr>
                {% for run, machine in wait_finish_runs %}
                <tr>
                    <td>{{ run }}</td>
                    <td>{{ machine }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>

        <div class="log-container">
            <h2>Execution Log</h2>
            <textarea id="log" rows="20" readonly>{{ log_contents }}</textarea>
        </div>
    </div>
    <script>
        var log = document.getElementById('log');
        log.scrollTop = log.scrollHeight;

        setInterval(function () {
            fetch('/log')
                .then(response => response.json())
                .then(data => {
                    log.value = data.log;
                    log.scrollTop = log.scrollHeight;
                });
        }, 5000);
    </script>
</body>

</html>
