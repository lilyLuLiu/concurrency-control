<!DOCTYPE html>
<html>

<head>
    <title>Concurrency Control for {{ project_name }}</title>
    <meta http-equiv="refresh" content="30">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <div class="container">
        <h1>Concurrency Control for {{ project_name }}</h1>
        <div class="table-container">
            <h2>Machine Status</h2>
            <table border="1">
                <tr>
                    <th>Machine</th>
                    <th>Status</th>
                    <th>PipelineRun</th>
                </tr>
                {% for machine, info in machine_info.items() %}
                <tr>
                    <td>{{ machine }}</td>
                    <td>{{ info.status }}</td>
                    <td>{{ info.run if info.run else '' }}</td>
                </tr>
                {% endfor %}
            </table>
        </div>

        <div class="reservation-container">
            <h2>Manage Machine</h2>
            <form action="/manage_machine" method="post">
                <label for="action">Action:</label>
                <select id="action" name="action">
                    <option value="reserve">Reserve</option>
                    <option value="return">Return</option>
                </select>
                <label for="machine_name">Machine Name:</label>
                <input type="text" id="machine_name" name="machine_name" required>
                <div id="user_name_div">
                    <label for="user_name">Your Name:</label>
                    <input type="text" id="user_name" name="user_name" required>
                </div>
                <input type="submit" value="Submit">
            </form>
        </div>

        <div class="log-container">
            <h2>Execution Log</h2>
            <textarea id="log" rows="20" readonly>{{ log_contents }}</textarea>
        </div>
    </div>
    <script>
        function toggleUserName() {
            const action = document.getElementById('action').value;
            const userNameDiv = document.getElementById('user_name_div');
            const userNameInput = document.getElementById('user_name');
            if (action === 'return') {
                userNameDiv.style.display = 'none';
                userNameInput.required = false;
            } else {
                userNameDiv.style.display = 'block';
                userNameInput.required = true;
            }
        }
        document.getElementById('action').addEventListener('change', toggleUserName);
        window.addEventListener('load', toggleUserName);

        var log = document.getElementById('log');
        log.scrollTop = log.scrollHeight;

        setInterval(function () {
            fetch('/log')
                .then(response => response.json())
                .then(data => {
                    log.value = data.log;
                    log.scrollTop = log.scrollHeight;
                });
        }, 5000);
    </script>
</body>

</html>
